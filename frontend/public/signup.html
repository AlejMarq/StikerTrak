<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StikerTrak</title>
    <link rel="stylesheet" href="../src/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="split">
        <a><span class="logo-green">Stiker</span>Tracker</a>
        <div class="center nav-options">
            <a href="index.html">Home</a>
            <a href="collection.html">Collection</a>
        </div>
        <div class="center btn-container">
            <button class="btn-white" onclick="window.location.href = 'login.html'">Login</button>
            <button onclick="window.location.href = 'signup.html'">Sign Up</button>
        </div>
    </nav>

    <section>
        <div class="form-vertical">
            <h2>Create Your Account</h2>
            <p>Join and start tracking your sticker collection</p>
            <form>
                <div class="split container-name">
                    <div class="start column">
                        <label>First Name</label>
                        <input placeholder="First Name">
                    </div>
                    <div class="start column">
                        <label>Last Name</label>
                        <input placeholder="Last Name">
                    </div>
                </div>
                <label>Username</label>
                <input placeholder="Username">
                <label>Email</label>
                <input placeholder="Email">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
                <button type="submit">Sign Up</button>
            </form>
            <p class="auth-redirect">Already have an account? <a class="logo-green" href="login.html">Login</a></p>
        </div>
    </section>
</body>

</html>
