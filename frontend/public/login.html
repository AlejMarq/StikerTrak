<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StikerTrak</title>
    <link rel="stylesheet" href="../src/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="split">
        <a><span class="logo-green">Stiker</span>Trackr</a>
        <div class="center nav-options">
            <a href="index.html">Home</a>
            <a href="collection.html">Collection</a>
        </div>
        <div class="center btn-container">
            <button class="btn-white" onclick="window.location.href = 'login.html'">Login</button>
            <button onclick="window.location.href = 'signup.html'">Sign Up</button>
        </div>
    </nav>

    <section>
        <div class="form-vertical">
            <h2>Welcome back!</h2>
            <p>Login to continue your collection</p>
            <form>
                <label>Email</label>
                <input placeholder="Email">
                <label>Password</label>
                <input type="password" placeholder="Password">
                <button type="submit">Login</button>
            </form>
            <p class="auth-redirect">Don't have an account? <a class="logo-green" href="signup.html">Sign Up</a></p>
        </div>
    </section>
</body>

</html>
