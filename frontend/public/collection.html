<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StikerTrak</title>
    <link rel="stylesheet" href="../src/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="split">
        <a><span class="logo-green">Stiker</span>Tracker</a>
        <div class="center nav-options">
            <a href="index.html">Home</a>
            <a href="collection.html">Collection</a>
        </div>
        <div class="center btn-container">
            <button class="btn-white" onclick="window.location.href = 'login.html'">Login</button>
            <button onclick="window.location.href = 'signup.html'">Sign Up</button>
        </div>
    </nav>

    <section class="section-collection">
        <div class="container-progress start column">
            <h3>Collection Progress</h3>
            <div class="progress-circle" style="--progress: 10">
                <div class="progress-center">
                    <span>10%</span>
                    <p>Complete</p>
                </div>
            </div>
            <a>98 / 980</a>
            <p>Stickers Collected</p>
        </div>

        <div class="main-collection start column">
            <h2>My Collection</h2>
            <p>Track your progress and complete your album</p>
            <div class="catalog">
                <div class="top split">
                    <div class="left start">
                        <a class="selected">All Stickers</a>
                        <a>Owned (0)</a>
                        <a>Missing (0)</a>
                        <a>Duplicates (0)</a>
                    </div>
                    <div class="right center">
                        <input placeholder="Search stickers...">
                        <select id="sort">
                            <option value="number-asc">Number: Low to High</option>
                            <option value="number-desc">Number: High to Low</option>
                            <option value="name-asc">Name: A to Z</option>
                            <option value="quantity-desc">Most Owned</option>
                        </select>
                    </div>
                </div>

                <div class="stickers">
                    <div class="sticker">
                        <div class="sticker-top">
                            <a>1</a>
                            <img src="../img/icon-check.png">
                        </div>
                        <img src="../img/sticker-messi.png">
                        <div class="quantity-selector">
                            <button type="button" class="quantity-button">−</button>
                            <span class="quantity-value">1</span>
                            <button type="button" class="quantity-button">+</button>
                        </div>
                    </div>

                    <div class="sticker">
                        <div class="sticker-top">
                            <a>2</a>
                            <img src="../img/icon-x.png">
                        </div>
                        <img src="../img/sticker-ronaldo.png">
                        <button class="btn-white">Add</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
